name: apply-adif-parser-patch

on:
  push:
    branches:
      - fix/codeql-adif-redos

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codeql-adif-redos
      - name: Wire linear parser into server
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'server.js';
          let source = fs.readFileSync(file, 'utf8');
          const oldImport = "const { parseCoord, safeEqual } = require('./security-helpers');\n";
          const newImport = oldImport + "const { parseAdif } = require('./adif-parser');\n";
          if (!source.includes(oldImport)) throw new Error('Expected security helper import not found.');
          source = source.replace(oldImport, newImport);
          const oldParser = `function parseAdif(text) {
            const records = [];
            const tag = /<([A-Z0-9_]+):(\\d+)(?::[^>]*)?>([^<]*)/ig;
            for (const chunk of String(text).split(/<EOR>/i)) {
              const record = {};
              let match;
              tag.lastIndex = 0;
              while ((match = tag.exec(chunk)) !== null) record[match[1].toUpperCase()] = match[3].slice(0, Number(match[2])).trim();
              if (Object.keys(record).length) records.push(record);
              if (records.length > 500_000) throw new Error('ADIF contains too many records.');
            }
            return records;
          }

          `;
          if (!source.includes(oldParser)) throw new Error('Expected regex ADIF parser not found.');
          source = source.replace(oldParser, '');
          fs.writeFileSync(file, source);
          NODE
          git rm .github/workflows/apply-adif-parser-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Use linear ADIF parser in server'
          git push
