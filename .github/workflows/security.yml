name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:prod

      - name: Prepare CI environment files
        run: |
          cp .env.production.example .env.production
          cp .env.development.example .env.development

      - name: Validate Compose privacy and logging topology
        env:
          DOMAIN: qso.example.com
          ADMIN_USER: admin
          ADMIN_PASSWORD: ci-only-long-random-password
          CONFIG_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters-long
          ADMIN_ALLOWED_IPS: 127.0.0.1
        run: |
          docker compose --env-file .env.production -f compose.prod.yaml config --format json > compose-prod.json
          docker compose --env-file .env.development -f compose.dev.yaml config --format json > compose-dev.json
          docker compose config --quiet
          node <<'NODE'
          const prod=require('./compose-prod.json');
          const dev=require('./compose-dev.json');
          if ((prod.services?.app?.ports||[]).length) throw new Error('Production app must not publish a host port');
          const ports=dev.services?.app?.ports||[];
          if (ports.length!==1 || String(ports[0].host_ip)!=='127.0.0.1' || Number(ports[0].target)!==3000) throw new Error('Development app must bind only 127.0.0.1:3000');
          if (!prod.services?.caddy?.volumes?.some(v=>String(v.target||'').includes('/var/log/qso-trails'))) throw new Error('Caddy log volume missing');
          NODE
          grep -q 'roll_keep_for 720h' Caddyfile.prod
          grep -Fq 'request>uri regexp [?].*$ ""' Caddyfile.prod
          grep -q 'request>headers delete' Caddyfile.prod
          grep -q 'resp_headers delete' Caddyfile.prod

      - name: Validate production Caddy configuration
        run: |
          mkdir -p .ci-caddy-logs
          docker run --rm \
            -e DOMAIN=qso.example.com \
            -v "$PWD/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/.ci-caddy-logs:/var/log/qso-trails" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build production app image
        run: docker compose --env-file .env.production -f compose.prod.yaml build app

      - name: Start production app for smoke test
        run: docker compose --env-file .env.production -f compose.prod.yaml run -d --name qso-trails-ci -p 3000:3000 app

      - name: Smoke test production, privacy, themes and Earth cache
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/embed >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs qso-trails-ci; exit 1; fi
            sleep 1
          done

          curl -fsS -D public.headers http://127.0.0.1:3000/api/public -o public.json
          node -e "const d=require('./public.json'); if(!Array.isArray(d.qsos)||!d.settings||'allQsoCount' in d||'returnedQsos' in d) process.exit(1)"
          grep -qi '^cache-control: no-store' public.headers
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/admin.html)" = "404"

          docker exec qso-trails-ci grep -Fq 'admin.js?v=20260823-1' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq "['midnight','Midnight']" /app/public/admin-publish.js
          curl -fsS -D admin-js.headers 'http://127.0.0.1:3000/assets/admin.js?v=20260823-1' -o /dev/null
          curl -fsS -D admin-publish.headers 'http://127.0.0.1:3000/assets/admin-publish.js?v=20260823-1' -o /dev/null
          grep -qi '^cache-control: no-store' admin-js.headers
          grep -qi '^cache-control: no-store' admin-publish.headers

          docker exec qso-trails-ci node -e "const fs=require('fs'),{encodePng}=require('/app/png-codec');const w=16,h=8,p=Buffer.alloc(w*h*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;p[i]=20+x*8;p[i+1]=70+y*15;p[i+2]=130+x*4;p[i+3]=255}fs.writeFileSync('/app/data/earth-blue-marble.png',encodePng(w,h,p))"
          curl -fsS http://127.0.0.1:3000/assets/earth-blue-marble.png -o earth.png
          test "$(xxd -p -l 8 earth.png)" = "89504e470d0a1a0a"

          for theme in retro clean futuristic rough midnight aurora amber mono ice earth; do
            curl -fsS -D static.headers "http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=$theme" -o "qrz-$theme-globe.png"
            grep -qi '^cache-control: no-store' static.headers
            test "$(xxd -p -l 8 qrz-$theme-globe.png)" = "89504e470d0a1a0a"
            test "$(stat -c%s qrz-$theme-globe.png)" -gt 1000
          done

          retro_hash="$(sha256sum qrz-retro-globe.png | cut -d' ' -f1)"
          for theme in midnight aurora amber mono ice earth; do
            test "$(sha256sum "qrz-$theme-globe.png" | cut -d' ' -f1)" != "$retro_hash"
          done

          for theme in clean earth; do
            curl -fsS "http://127.0.0.1:3000/static/qrz.png?projection=mercator&theme=$theme&name=0&stats=0&legend=0&dxcc=0&updated=0" -o "qrz-$theme-mercator.png"
            test "$(xxd -p -l 8 qrz-$theme-mercator.png)" = "89504e470d0a1a0a"
            test "$(stat -c%s qrz-$theme-mercator.png)" -gt 1000
          done
          test "$(sha256sum qrz-earth-mercator.png | cut -d' ' -f1)" != "$(sha256sum qrz-clean-mercator.png | cut -d' ' -f1)"

          curl -fsS 'http://127.0.0.1:3000/embed?theme=earth' | grep -q '/assets/dom-safety.js'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/theme-pack.js)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/admin-theme-pack.js)" = "200"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f qso-trails-ci >/dev/null 2>&1 || true
