name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:prod

      - name: Prepare CI environment files
        run: |
          cp .env.production.example .env.production
          cp .env.development.example .env.development

      - name: Validate Compose privacy and logging topology
        env:
          DOMAIN: qso.example.com
          ADMIN_USER: admin
          ADMIN_PASSWORD: ci-only-long-random-password
          CONFIG_ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters-long
          ADMIN_ALLOWED_IPS: 127.0.0.1
        run: |
          docker compose --env-file .env.production -f compose.prod.yaml config --format json > compose-prod.json
          docker compose --env-file .env.development -f compose.dev.yaml config --format json > compose-dev.json
          docker compose config --quiet
          node <<'NODE'
          const prod=require('./compose-prod.json');
          const dev=require('./compose-dev.json');
          if ((prod.services?.app?.ports||[]).length) throw new Error('Production app must not publish a host port');
          const ports=dev.services?.app?.ports||[];
          if (ports.length!==1 || String(ports[0].host_ip)!=='127.0.0.1' || Number(ports[0].target)!==3000) throw new Error('Development app must bind only 127.0.0.1:3000');
          if (!prod.services?.caddy?.volumes?.some(v=>String(v.target||'').includes('/var/log/qso-trails'))) throw new Error('Caddy log volume missing');
          NODE
          grep -q 'roll_keep_for 720h' Caddyfile.prod
          grep -Fq 'request>uri regexp [?].*$ ""' Caddyfile.prod
          grep -q 'request>headers delete' Caddyfile.prod
          grep -q 'resp_headers delete' Caddyfile.prod

      - name: Validate production Caddy configuration
        run: |
          mkdir -p .ci-caddy-logs
          docker run --rm \
            -e DOMAIN=qso.example.com \
            -v "$PWD/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/.ci-caddy-logs:/var/log/qso-trails" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build production app image
        run: docker compose --env-file .env.production -f compose.prod.yaml build --build-arg QSO_TRAILS_SKIP_EARTH_BUILD=1 app

      - name: Start production app for smoke test
        run: docker compose --env-file .env.production -f compose.prod.yaml run -d --name qso-trails-ci -p 3000:3000 -e ADMIN_ALLOWED_IPS=172.16.0.0/12 -e ADMIN_USER=admin -e ADMIN_PASSWORD=ci-only-long-random-password app

      - name: Smoke test production, privacy, CSP, themes and Earth cache
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/embed >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs qso-trails-ci; exit 1; fi
            sleep 1
          done

          curl -fsS -D public.headers http://127.0.0.1:3000/api/public -o public.json
          node -e "const d=require('./public.json'); if(!Array.isArray(d.qsos)||!d.settings||'allQsoCount' in d||'returnedQsos' in d) process.exit(1)"
          grep -qi '^cache-control: no-store' public.headers
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/admin.html)" = "404"

          docker exec qso-trails-ci grep -Fq 'Admin UI build 2026-08-28.1' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq 'style.css?v=20260828-1' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq 'admin.js?v=20260828-1' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq 'admin-lotw.js?v=20260828-1' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq 'id="staticShowLotw"' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq 'id="staticGrid"' /app/public/admin.html
          docker exec qso-trails-ci grep -Fq 'id="diagnosticsCard"' /app/public/admin.html
          docker exec qso-trails-ci sh -lc '! grep -Eq "[[:space:]]style=" /app/public/admin.html'

          docker exec qso-trails-ci grep -Fq 'embed.css?v=20260828-1' /app/public/embed.html
          docker exec qso-trails-ci grep -Fq 'theme-pack.js?v=20260828-1' /app/public/embed.html
          docker exec qso-trails-ci grep -Fq 'globe.js?v=20260828-1' /app/public/embed.html
          docker exec qso-trails-ci grep -Fq 'embed-extras.js?v=20260828-1' /app/public/embed.html
          docker exec qso-trails-ci grep -Fq 'embed-lotw.js?v=20260828-1' /app/public/embed.html
          docker exec qso-trails-ci sh -lc '! grep -Eqi "<style([[:space:]>])" /app/public/embed.html'
          docker exec qso-trails-ci sh -lc '! grep -Eq "[[:space:]]style=" /app/public/embed.html'
          docker exec qso-trails-ci sh -lc '! grep -Fq ".style." /app/public/theme-pack.js'
          docker exec qso-trails-ci sh -lc '! grep -Fq ".style." /app/public/embed-extras.js'
          docker exec qso-trails-ci sh -lc '! grep -Fq ".style." /app/public/globe.js'

          curl -fsS -D admin-js.headers 'http://127.0.0.1:3000/assets/admin.js?v=20260828-1' -o /dev/null
          grep -qi '^cache-control: no-store' admin-js.headers
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/assets/embed.css?v=20260828-1')" = "200"

          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/admin/diagnostics)" = "401"
          curl -fsS -u 'admin:ci-only-long-random-password' -D diagnostics.headers 'http://127.0.0.1:3000/api/admin/diagnostics?limit=50' -o diagnostics.json
          grep -qi '^cache-control: no-store' diagnostics.headers
          node -e "const d=require('./diagnostics.json');if(!d.earth||!Array.isArray(d.logs)||'csrfToken' in d)process.exit(1)"

          docker exec qso-trails-ci node -e "const fs=require('fs'),{encodePng}=require('/app/png-codec');const w=4096,h=2048,p=Buffer.alloc(w*h*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;p[i]=(x*17+y*3)&255;p[i+1]=(x*5+y*11)&255;p[i+2]=(x*7+y*13)&255;p[i+3]=255}fs.writeFileSync('/app/data/earth-blue-marble-ng-200412.png',encodePng(w,h,p))"
          curl -fsSI 'http://127.0.0.1:3000/assets/earth-blue-marble.png?v=20260828-1' > earth.headers
          grep -qi '^content-type: image/png' earth.headers
          grep -qi '^x-qso-trails-texture-dimensions: 1280x640' earth.headers
          grep -qi '^x-qso-trails-texture-bytes:' earth.headers
          curl -fsS 'http://127.0.0.1:3000/assets/earth-blue-marble.png?v=20260828-1' -o earth.png
          test "$(xxd -p -l 8 earth.png)" = "89504e470d0a1a0a"
          test "$(stat -c%s earth.png)" -lt 4194304
          node - <<'NODE'
          const fs=require('fs');
          const {decodePng}=require('./png-codec');
          const image=decodePng(fs.readFileSync('earth.png'),{maxPixels:1_000_000});
          if(image.width!==1280||image.height!==640)throw new Error(`Browser Earth texture mismatch: ${image.width}x${image.height}`);
          for(let i=0;i<Math.min(image.data.length,200000);i+=4){
            if((image.data[i]&3)||(image.data[i+1]&3)||(image.data[i+2]&3))throw new Error('Browser Earth RGB quantization missing');
          }
          NODE

          for theme in retro clean futuristic rough midnight aurora amber mono ice earth; do
            curl -fsS -D static.headers "http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=$theme" -o "qrz-$theme-globe.png"
            grep -qi '^cache-control: no-store' static.headers
            test "$(xxd -p -l 8 qrz-$theme-globe.png)" = "89504e470d0a1a0a"
            test "$(stat -c%s qrz-$theme-globe.png)" -gt 1000
          done

          retro_hash="$(sha256sum qrz-retro-globe.png | cut -d' ' -f1)"
          for theme in midnight aurora amber mono ice earth; do
            test "$(sha256sum "qrz-$theme-globe.png" | cut -d' ' -f1)" != "$retro_hash"
          done

          for theme in clean earth; do
            curl -fsS "http://127.0.0.1:3000/static/qrz.png?projection=mercator&theme=$theme&name=0&stats=0&legend=0&dxcc=0&continents=0&rarity=0&updated=0" -o "qrz-$theme-mercator.png"
            test "$(xxd -p -l 8 qrz-$theme-mercator.png)" = "89504e470d0a1a0a"
            test "$(stat -c%s qrz-$theme-mercator.png)" -gt 1000
          done
          test "$(sha256sum qrz-earth-mercator.png | cut -d' ' -f1)" != "$(sha256sum qrz-clean-mercator.png | cut -d' ' -f1)"

          curl -fsS 'http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=earth&name=0&stats=0&legend=0&dxcc=0&continents=0&rarity=0&updated=0' -o qrz-earth-globe-plain.png
          test "$(sha256sum qrz-earth-globe-plain.png | cut -d' ' -f1)" != "$(sha256sum qrz-earth-mercator.png | cut -d' ' -f1)"

          curl -fsS 'http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=earth&width=800&lotw=1&grid=4&continents=0&rarity=0' -o qrz-earth-sized.png
          curl -fsS 'http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=retro&width=800' -o qrz-retro-sized.png
          curl -fsS 'http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=earth&size=qrz' -o qrz-preset.png
          curl -fsS 'http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=earth&size=qso-card' -o qso-card-preset.png
          curl -fsS 'http://127.0.0.1:3000/static/qrz.png?projection=globe&theme=earth&size=homepage' -o homepage-preset.png
          node - <<'NODE'
          const fs=require('fs');
          const {decodePng}=require('./png-codec');
          const dimensions=(file,max=2_000_000)=>{const p=decodePng(fs.readFileSync(file),{maxPixels:max});return[p.width,p.height]};
          if(String(dimensions('qrz-earth-sized.png'))!=='800,625')throw new Error('Earth custom size/aspect ratio mismatch');
          if(String(dimensions('qrz-retro-sized.png'))!=='800,625')throw new Error('Legacy custom size/aspect ratio mismatch');
          if(String(dimensions('qrz-preset.png'))!=='640,500')throw new Error('QRZ preset mismatch');
          if(String(dimensions('qso-card-preset.png'))!=='960,750')throw new Error('QSO card preset mismatch');
          if(String(dimensions('homepage-preset.png',2_000_000))!=='1280,1000')throw new Error('Homepage preset mismatch');
          const globe=decodePng(fs.readFileSync('qrz-earth-sized.png'),{maxPixels:1_000_000});
          const mapHeight=Math.round(globe.height*338/500);let minX=globe.width,minY=mapHeight,maxX=-1,maxY=-1;
          for(let y=0;y<mapHeight;y++)for(let x=0;x<globe.width;x++){
            const i=(y*globe.width+x)*4;
            if(globe.data[i+2]>50){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
          }
          const sphereWidth=maxX-minX+1,sphereHeight=maxY-minY+1;
          if(sphereWidth<100||sphereHeight<100||Math.abs(sphereWidth-sphereHeight)>4)throw new Error(`Earth globe is not round: ${sphereWidth}x${sphereHeight}`);
          NODE

          curl -fsS 'http://127.0.0.1:3000/embed?theme=earth&dxccrare=0&dxccmode=0' -o earth-embed.html
          grep -Fq '/assets/embed.css?v=20260828-1' earth-embed.html
          grep -Fq '/assets/theme-pack.js?v=20260828-1' earth-embed.html
          grep -Fq '/assets/globe.js?v=20260828-1' earth-embed.html
          grep -Fq '/assets/embed-extras.js?v=20260828-1' earth-embed.html
          grep -Fq '/assets/embed-lotw.js?v=20260828-1' earth-embed.html
          ! grep -Eqi '<style([[:space:]>])' earth-embed.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/assets/theme-pack.js?v=20260828-1')" = "200"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f qso-trails-ci >/dev/null 2>&1 || true
