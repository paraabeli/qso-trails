name: qso-trails

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_BASE_URL: "https://${DOMAIN:?Set DOMAIN in .env.production}"
      REQUIRE_ADMIN_ALLOWLIST: "true"
    volumes:
      - qso_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/embed >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - reverse-proxy
      - --from
      - "${DOMAIN:?Set DOMAIN in .env.production}"
      - --to
      - "app:3000"
      - --access-log
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qso_data:
  caddy_data:
  caddy_config:
