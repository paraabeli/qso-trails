<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QSO Trails</title><style>html,body{margin:0;background:#02060c;color:#eef;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#wrap{position:relative;overflow:hidden;background:#050a12}canvas{display:block;width:100%;height:min(620px,75vw);min-height:420px;touch-action:none}.hud{position:absolute;left:12px;top:10px;background:#050b14c7;padding:8px 10px;border-radius:10px;max-width:min(88%,520px)}.hint{position:absolute;left:12px;bottom:10px;font-size:11px;background:#050b14aa;padding:6px;border-radius:8px}.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11px}.legend span{display:inline-flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.details,.replayHud,.dxcc{margin-top:7px;font-size:12px;line-height:1.35;color:#d9e5f5}.replay{position:absolute;right:12px;bottom:10px;background:#050b14dc;padding:8px;border-radius:10px;display:none;gap:7px;align-items:center;max-width:min(82%,620px);flex-wrap:wrap}.replay.show{display:flex}.replay button,.tools button{border:1px solid #43546b;background:#111d2c;color:#eef;border-radius:7px;padding:5px 9px;cursor:pointer}.replay input[type=range]{width:min(260px,36vw)}.tools{position:absolute;right:12px;top:10px;background:#050b14c7;padding:8px;border-radius:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:min(48%,430px)}.tools input,.tools select{background:#111d2c;color:#eef;border:1px solid #43546b;border-radius:7px;padding:5px;max-width:150px}.recording{outline:2px solid #ef4444}</style></head><body><div id="wrap"><canvas id="c" aria-label="Interactive globe showing public QSO paths"></canvas><div class="hud"><b id="name">QSO Trails</b><div id="stats">Loading…</div><div id="legend" class="legend"></div><div id="details" class="details">Click a QSO point for distance and bearing.</div><div id="replayHud" class="replayHud"></div><div id="dxcc" class="dxcc"></div></div><div class="tools"><input id="callSearch" placeholder="Search public callsign" aria-label="Search public callsign"><button id="callFocus" type="button">Focus</button><label><input id="liveToggle" type="checkbox"> Live</label><button id="recordButton" type="button">Export WebM</button></div><div class="hint">Drag to rotate · wheel to zoom · click a QSO point</div><div id="replay" class="replay"><button id="replayButton" type="button">Replay</button><input id="replayRange" type="range" min="0" max="1000" value="1000"><small id="replayLabel">100%</small><label><input id="loopToggle" type="checkbox"> Loop</label><label><input id="followToggle" type="checkbox"> Follow</label><label><input id="realtimeToggle" type="checkbox"> Relative timing</label><label><input id="fadeToggle" type="checkbox" checked> Fade</label><select id="bandReplay"><option value="all">All bands</option></select></div></div><script src="/assets/globe.js"></script></body></html>
