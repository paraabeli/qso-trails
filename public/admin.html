<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QSO Trails Admin</title><link rel="stylesheet" href="/assets/style.css"><main><h1>QSO Trails Admin</h1><p>Sync Wavelog or upload ADIF, then choose exactly what the public iframe may display.</p><div class="cols"><section class="card"><h2>Wavelog</h2><label>Base URL<input id="wlurl" placeholder="https://log.example.com"></label><label>API v2 token<input id="wltoken" type="password" placeholder="wl2_…"></label><label>Station IDs<input id="wlstations" placeholder="blank = all"></label><label>Auto sync<select id="wlauto"><option value="0">Off</option><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">Hourly</option><option value="360">6 hours</option></select></label><div class="row"><button id="savewl">Save</button><button id="testwl">Test</button><button id="syncwl">Sync new</button><button id="fullwl">Full resync</button></div><p id="wlstatus" class="status"></p><h2>ADIF fallback</h2><input id="adif" type="file" accept=".adi,.adif"><button id="upload">Upload ADIF</button></section><section class="card"><h2>Public view</h2><label>Station / callsign<input id="name"></label><label>Home Maidenhead<input id="grid"></label><h3>Bands</h3><div id="bands" class="checks"></div><h3>Modes</h3><div id="modes" class="checks"></div><label class="inline"><input id="rotate" type="checkbox"> Auto rotate</label><label class="inline"><input id="stats" type="checkbox"> Show QSO count</label><label class="inline"><input id="calls" type="checkbox"> Expose callsigns publicly</label><label>Max paths<input id="max" type="number" min="100" max="10000"></label><button id="publish">Publish selected view</button><p id="status" class="status"></p><h3>Iframe</h3><pre id="iframe"></pre></section></div><section class="card"><iframe id="preview" src="/embed"></iframe></section></main><script src="/assets/admin.js"></script>
